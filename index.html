<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport"
          content = "width=device-width,initial-scale=1.0">
    <title>Expense Tracker</title> 

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="app">
        <h1>Expense Tracker</h1>
        <div class="summary" >

            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">₹0</p>
            </div>

            <div class="card" >
                <h3>Total Expense</h3>
                <p id="total-expense">₹0</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>
        </div>

        <div class="dashboard-row">
            <div class="monthly-summary">
                <h2>Monthly Summary</h2>
                <input type="month" id="summary-month">
                <p>Total Income: <span id="monthly-income">₹0</span></p>
                <p>Total Expense: <span id="monthly-expenses">₹0</span></p>
                <p>Balance: <span id="monthly-balance">₹0</span></p>
            </div>

            <div class="category-chart">
                <h2>Expense by Category</h2>
                <div id="category-chart"></div>
            </div>
        </div>

        <form id="transaction-form">
            <div class="form-group">
                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount">
            </div>

            <div class="form-group">
                <label for="category">Category</label>

                <select id="category">
                    <option value="salary">Salary</option>
                    <option value="freelance">Freelance</option>
                    <option value="business">Business</option>
                    <option value="gift">Gift</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Enter description"></textarea>
            </div>

            <button type="submit">Add Transaction</button>
        </form>
    <div class="filters">
        <select id="filter-type">
            <option value="all">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <select id="filter-category">
            <option value="all">All Categories</option>
        </select>
    </div>
    <div id="transaction-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
